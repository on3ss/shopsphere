apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: shopsphere/inventory-service
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
            # spring-boot.run.fork=false (set in the Dockerfile CMD) means
            # Maven's own JVM runs the app directly — one process per pod,
            # not two — so these options apply to that single JVM.
            # TieredStopAtLevel=1 skips the C2 JIT tier: slower steady-state
            # throughput, faster boot, which is the trade you want for a
            # process that restarts on every hot reload.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m -XX:MaxMetaspaceSize=192m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: shopsphere
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8083
      targetPort: 8083
