apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: shopsphere/config-server
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            - name: CONFIG_REPO_PATH
              value: /workspace/config-repo
            # spring-boot.run.fork=false (set in the Dockerfile CMD) means
            # Maven's own JVM runs the app directly — one process per pod,
            # not two — so these options apply to that single JVM.
            # TieredStopAtLevel=1 skips the C2 JIT tier: slower steady-state
            # throughput, faster boot, which is the trade you want for a
            # process that restarts on every hot reload.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: shopsphere
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
