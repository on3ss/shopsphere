apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-inventory
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-inventory
  template:
    metadata:
      labels:
        app: postgres-inventory
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inventory_db
            - name: POSTGRES_USER
              value: inventory
            - name: POSTGRES_PASSWORD
              value: inventory
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # emptyDir keeps this simple for local/dev use — data is lost when the
        # pod is recreated. Swap for a PVC if you need it to survive restarts.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-inventory
  namespace: shopsphere
spec:
  selector:
    app: postgres-inventory
  ports:
    - port: 5432
      targetPort: 5432
