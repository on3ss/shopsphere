apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # In-cluster clients reach Kafka via the Service DNS name, not
            # localhost — this is the one line that differs from compose.yml.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.shopsphere.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka.shopsphere.svc.cluster.local:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # Image defaults to -Xmx1G; pin it explicitly to match the
            # container memory limit below instead.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
            # Explicit, known path — mounted below as a volume so a container
            # restart doesn't wipe the formatted KRaft storage and force a
            # full first-boot format-and-bootstrap cycle every time.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              # Bumped from 250m — under contention, Kubernetes allocates
              # CPU time proportional to each container's request (its
              # cgroup cpu.shares weight), so a low request here means Kafka
              # gets throttled *harder* than its neighbors precisely when
              # everyone's competing for the same cores, which is exactly
              # the failure mode we're chasing.
              cpu: 750m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1280Mi
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            # KRaft's first-boot format-and-bootstrap sequence is slower than
            # a warm restart — give it real headroom rather than tuning this
            # down to what a warm start needs and racing the probe against it.
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            # Longer than readiness's own worst case (40 + 6*10 = 100s) so a
            # slow-but-progressing first boot is never killed mid-format —
            # that's what turns a slow start into a genuine crash loop.
            initialDelaySeconds: 110
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        # emptyDir survives container restarts within the same pod (only
        # wiped if the pod itself is deleted/rescheduled) — enough to break
        # the reformat-on-every-restart loop without needing a real PVC.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: shopsphere
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
