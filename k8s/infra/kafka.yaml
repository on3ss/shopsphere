apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Generate a complete server.properties with the correct log.dirs.
              # We do NOT rely on the image's entrypoint to translate env vars,
              # because in apache/kafka:4.1.0 that entrypoint calls
              # `kafka-storage.sh format` without --standalone, which is invalid
              # under the dynamic-quorum model this broker uses.
              cat > /tmp/server.properties <<'EOF'
              node.id=1
              process.roles=broker,controller
              listeners=PLAINTEXT://:9092,CONTROLLER://:9093
              advertised.listeners=PLAINTEXT://kafka.shopsphere.svc.cluster.local:9092
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
              controller.listener.names=CONTROLLER
              controller.quorum.bootstrap.servers=kafka.shopsphere.svc.cluster.local:9093
              log.dirs=/var/lib/kafka/data
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              auto.create.topics.enable=false
              EOF

              # Sanity check: the file must point at the mounted volume.
              grep -qx 'log.dirs=/var/lib/kafka/data' /tmp/server.properties

              # Format only on first boot. --standalone is mandatory in Kafka 4.1.0.
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                echo "Formatting KRaft storage with --standalone..."
                CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
                /opt/kafka/bin/kafka-storage.sh format --standalone \
                  -t "$CLUSTER_ID" \
                  -c /tmp/server.properties
              else
                echo "Storage already formatted, skipping format step."
              fi

              # Start the broker directly — do NOT go through /etc/kafka/docker/run.
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 750m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1280Mi
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 110
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: shopsphere
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093